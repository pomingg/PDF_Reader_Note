<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>HyRead 同步</title>
    <style>
      body { font: 14px/1.5 system-ui, "Microsoft JhengHei", sans-serif; margin: 0; padding: 16px; width: 340px; color: #0f172a; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p { color: #64748b; margin: 0 0 12px; font-size: 12px; }
      label { display: block; margin: 10px 0 4px; font-size: 12px; color: #475569; }
      input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button { padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; font: inherit; }
      button.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
      #msg { margin-top: 10px; font-size: 12px; }
      .ok { color: #15803d; } .err { color: #b91c1c; }
      #stats { margin-top: 12px; padding: 8px; background: #f1f5f9; border-radius: 6px; font-size: 12px; color: #334155; }
    </style>
  </head>
  <body>
    <h1>HyRead → PDF 閱讀筆記</h1>
    <p>在 HyRead 網頁閱讀時畫的重點與筆記，會自動送到你電腦上的閱讀筆記程式。</p>
    <label for="appUrl">閱讀筆記程式網址</label>
    <input id="appUrl" type="text" placeholder="http://localhost:3000" />
    <label for="token">同步金鑰（在閱讀筆記的「🔄 HyRead 同步」頁複製）</label>
    <input id="token" type="password" placeholder="貼上同步金鑰" />
    <label><input id="enabled" type="checkbox" /> 啟用自動同步</label>
    <div class="row">
      <button class="primary" id="save">儲存</button>
      <button id="test">測試連線</button>
    </div>
    <div id="msg"></div>
    <div id="stats"></div>
    <script src="options.js"></script>
  </body>
</html>
